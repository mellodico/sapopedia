services:
  - type: web
    name: sapopedia
    runtime: docker
    plan: free
    region: virginia
    branch: prod
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      # Conexão direta (sem -pooler) ao branch 'prod' do Neon, por causa do Flyway:
      # jdbc:postgresql://<host>/neondb?sslmode=require
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
