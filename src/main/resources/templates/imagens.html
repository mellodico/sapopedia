<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/css/style.css">
  <script src="/js/components.js" defer></script>
  <title>SapoPédia - Imagens</title>
</head>

<body>
  <div class="container">
    <site-header active="imagens" th:attr="usuario=${usuarioLogado?.username}"></site-header>

    <main class="gallery-page">
      <section class="page-header">
        <div>
          <h2>Galeria de imagens</h2>
          <p>Fotografias de anfíbios e paisagens do Brasil.</p>
        </div>
      </section>

      <p class="forum-empty" th:if="${#lists.isEmpty(imagens)}">Nenhuma imagem cadastrada ainda.</p>

      <section class="gallery-grid" aria-label="Galeria da wiki" th:unless="${#lists.isEmpty(imagens)}">
        <img class="gallery-item" th:each="imagem : ${imagens}" th:src="@{'/' + ${imagem.caminho}}"
          th:alt="${imagem.textoAlternativo}" th:title="${imagem.legenda}" src="/img/foto3.jpg" alt="Imagem da galeria">
      </section>
    </main>

    <site-footer></site-footer>
  </div>
</body>


</html>
