spring.application.name=sapopedia

# A senha não fica no repositório: defina DB_PASSWORD ou crie config/application.properties
# (ignorado pelo git) a partir de config/application.properties.example
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/sapopedia}
spring.datasource.username=${DB_USERNAME:sapopedia_admin}
spring.datasource.password=${DB_PASSWORD}

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

server.servlet.session.tracking-modes=cookie
